<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mur de Citations</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* Grille des citations */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            color: #333;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 150px;
        }

        .card:hover { transform: translateY(-5px); }
        .card p { font-style: italic; margin: 0 0 10px 0; font-size: 1.1em; }
        .card span { font-weight: bold; font-size: 0.9em; opacity: 0.8; }

        .btn-add {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 10px;
            background: #333;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Mon Mur de Citations ✨</h1>
        
        <a href="{% url 'ajouter_citation' %}" class="btn-add">Ajouter une citation</a>

        <div class="grid">
            {% for citation in citations %}
                <!-- On injecte la couleur personnalisée ici -->
                <div class="card" style="background-color: {{ citation.couleur_fond }};">
                    <p>"{{ citation.texte }}"</p>
                    <span>- {{ citation.auteur }}</span>
                </div>
            {% empty %}
                <p>Aucune citation pour le moment. Sois le premier !</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
